<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff4f8"><link rel="manifest" href="/manifest.webmanifest"><title>Soft Notes</title></head>
<body><div id="app"><header><span>✿ Soft Notes</span><div class="head-actions"><button id="chatOpen">♡ Chat</button><button id="theme">Customize</button></div></header>
<section id="chat" class="chat-card hidden">
  <div class="chat-title">Little chat <button id="chatClose">×</button></div>
  <div id="chatStart"><p>Make a room and share the code 💌</p><button id="makeRoom">Create room</button><div class="chat-join"><input id="roomCode" placeholder="Room code"><button id="joinRoom">Join</button></div><small id="chatStatus">An internet connection and chat server are required.</small></div>
  <div id="chatMessagesArea" class="hidden"><p>Room: <b id="activeRoom"></b> <button id="shareRoom">Share link</button></p><div id="chatMessages"></div><div class="chat-join"><label class="chat-attach">＋<input id="chatImage" type="file" accept="image/*" hidden></label><input id="chatText" placeholder="Write a message…"><button id="send">➤</button></div><button id="endChat">End chat</button></div>
</section><main><div class="top"><input id="title" placeholder="A little note…"><button id="new">＋</button></div><div id="editor" contenteditable="true" data-placeholder="Write something lovely…"></div><div class="tools"><label class="upload">Add image<input id="image" type="file" accept="image/*" hidden></label><span id="status">Saved on this device</span></div><section id="settings" class="hidden"><label>Colour <input id="color" type="color" value="#fff4f8"></label><label>Transparency <input id="opacity" type="range" min="20" max="100" value="94"></label><label>Decoration <select id="decor"><option>None</option><option>Stars</option><option>Flowers</option><option>Hearts</option></select></label></section></main></div><script type="module" src="/app.js"></script></body></html>
